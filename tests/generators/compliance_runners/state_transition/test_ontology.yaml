stages:
  validator_lifecycle:
    description: Activation, exit, slashing, effective balance, and Electra pending queues.
    handlers:
      - registry_updates
      - slashings
      - effective_balance_updates
      - pending_deposits
      - pending_consolidations
  participation_finality:
    description: Finality, inactivity, rewards, penalties, and participation flag rotation.
    handlers:
      - justification_and_finalization
      - inactivity_updates
      - rewards_and_penalties
      - participation_flag_updates

targets:
  operations:
    proposer_slashing:
      functions:
        - process_proposer_slashing
    attester_slashing:
      functions:
        - process_attester_slashing
    attestation:
      functions:
        - process_attestation
    deposit:
      functions:
        - process_deposit
        - apply_deposit
    bls_to_execution_change:
      functions:
        - process_bls_to_execution_change
    deposit_request:
      functions:
        - process_deposit_request
    voluntary_exit:
      functions:
        - process_voluntary_exit
    withdrawal_request:
      functions:
        - process_withdrawal_request
    consolidation_request:
      functions:
        - is_valid_switch_to_compounding_request
        - process_consolidation_request
  epoch_processing:
    justification_and_finalization:
      functions:
        - process_justification_and_finalization
        - weigh_justification_and_finalization
    registry_updates:
      functions:
        - process_registry_updates
    slashings:
      functions:
        - process_slashings
    inactivity_updates:
      functions:
        - process_inactivity_updates
    rewards_and_penalties:
      functions:
        - process_rewards_and_penalties
        - get_flag_index_deltas
        - get_inactivity_penalty_deltas
    participation_flag_updates:
      functions:
        - process_participation_flag_updates
    pending_deposits:
      functions:
        - process_pending_deposits
    pending_consolidations:
      functions:
        - process_pending_consolidations
    effective_balance_updates:
      functions:
        - process_effective_balance_updates

intents:
  operations:
    proposer_slashing:
      success:
        outcome: changed
      same_header:
        outcome: assertion_failure
      proposer_mismatch:
        outcome: assertion_failure
      already_slashed:
        outcome: assertion_failure
      bad_signature:
        outcome: assertion_failure

    attester_slashing:
      success:
        outcome: changed
      not_slashable_data:
        outcome: assertion_failure
      no_overlap:
        outcome: assertion_failure
      already_slashed:
        outcome: assertion_failure
      bad_signature:
        outcome: assertion_failure

    attestation:
      success:
        outcome: changed
      previous_epoch_success:
        outcome: changed
      future_slot:
        outcome: assertion_failure
      wrong_target_epoch:
        outcome: assertion_failure
      bad_committee_index:
        outcome: assertion_failure
      empty_aggregation:
        outcome: assertion_failure
      bad_signature:
        outcome: assertion_failure

    deposit:
      new_validator:
        outcome: changed
      top_up_existing_validator:
        outcome: changed
      invalid_proof:
        outcome: assertion_failure
      invalid_signature:
        outcome: changed

    bls_to_execution_change:
      success:
        outcome: changed
      out_of_range:
        outcome: assertion_failure
      not_bls_credentials:
        outcome: assertion_failure
      pubkey_mismatch:
        outcome: assertion_failure
      bad_signature:
        outcome: assertion_failure

    deposit_request:
      start_index_unset:
        outcome: changed
      start_index_set:
        outcome: changed

    voluntary_exit:
      success:
        outcome: changed
      inactive:
        outcome: assertion_failure
      already_exited:
        outcome: assertion_failure
      future_epoch:
        outcome: assertion_failure
      not_active_long_enough:
        outcome: assertion_failure
      pending_withdrawal:
        outcome: assertion_failure

    withdrawal_request:
      queue_full:
        outcome: no_change
      pubkey_missing:
        outcome: no_change
      bad_source_address:
        outcome: no_change
      source_inactive:
        outcome: no_change
      source_exiting:
        outcome: no_change
      not_active_long_enough:
        outcome: no_change
      full_exit_with_pending_withdrawal:
        outcome: no_change
      partial_conditions_not_met:
        outcome: no_change
      success_full_exit:
        outcome: changed
      success_partial_withdrawal:
        outcome: changed

    consolidation_request:
      switch_to_compounding_success:
        outcome: changed
      switch_pubkey_missing:
        outcome: no_change
      switch_bad_source_address:
        outcome: no_change
      switch_source_inactive:
        outcome: no_change
      switch_source_exiting:
        outcome: no_change
      source_equals_target:
        outcome: no_change
      queue_full:
        outcome: no_change
      churn_too_low:
        outcome: no_change
      source_missing:
        outcome: no_change
      target_missing:
        outcome: no_change
      bad_source_address:
        outcome: no_change
      target_not_compounding:
        outcome: no_change
      source_inactive:
        outcome: no_change
      target_inactive:
        outcome: no_change
      source_exiting:
        outcome: no_change
      target_exiting:
        outcome: no_change
      source_not_active_long_enough:
        outcome: no_change
      source_pending_withdrawal:
        outcome: no_change
      success:
        outcome: changed

  epoch_processing:
    justification_and_finalization:
      genesis_skip:
        outcome: no_change
      current_justified:
        outcome: changed
      previous_justified:
        outcome: changed
      poor_support:
        outcome: no_change
      finalize_current:
        outcome: changed
      finalize_234:
        outcome: changed
      finalize_23:
        outcome: changed
      finalize_123:
        outcome: changed

    registry_updates:
      no_change:
        outcome: no_change
      activation_queue:
        outcome: changed
      ejection:
        outcome: changed
      activation:
        outcome: changed

    slashings:
      no_slashed_validators:
        outcome: no_change
      penalty_applied:
        outcome: changed
      wrong_withdrawable_epoch:
        outcome: no_change
      zero_slashing_balance:
        outcome: no_change

    inactivity_updates:
      genesis_skip:
        outcome: no_change
      participating_recovery:
        outcome: changed
      non_participating_no_leak:
        outcome: changed
