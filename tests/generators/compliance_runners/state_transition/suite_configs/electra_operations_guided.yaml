name: electra_operations_guided
description: Guided Electra operation vectors backed by the state-transition test ontology.

generation:
  output: state_transition_tests_guided
  fork: electra
  preset: minimal
  handlers:
    - proposer_slashing
    - attester_slashing
    - attestation
    - deposit
    - bls_to_execution_change
    - deposit_request
    - voluntary_exit
    - withdrawal_request
    - consolidation_request
    - pending_deposits
    - pending_consolidations
    - effective_balance_updates
    - registry_updates
    - justification_and_finalization
  per_handler_limit: 40
  guided: true
  changed_only: false
  unchanged_only: false
  invalid_only: false
  keep_existing: false

coverage:
  output: state_transition_coverage_guided
  ontology: tests/generators/compliance_runners/state_transition/test_ontology.yaml
  html: true
  annotate: true
  json: true
