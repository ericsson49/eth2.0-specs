name: electra_operations_guided
description: Guided Electra operation vectors not owned by a stage suite.

generation:
  fork: electra
  preset: minimal
  handlers:
    - proposer_slashing
    - attester_slashing
    - attestation
    - deposit
    - bls_to_execution_change
    - deposit_request
    - voluntary_exit
    - withdrawal_request
    - consolidation_request
  per_handler_limit: 40
  guided: true
  changed_only: false
  unchanged_only: false
  invalid_only: false
  keep_existing: false

coverage:
  ontology: tests/generators/compliance_runners/state_transition/test_ontology.yaml
  html: true
  annotate: true
  json: true
