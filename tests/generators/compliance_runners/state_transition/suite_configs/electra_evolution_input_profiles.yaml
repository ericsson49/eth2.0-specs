name: electra_evolution_input_profiles
description: "Profile reverse-map suite: sample one-wise handler-specific branch and input profile dimensions."

generation:
  fork: electra
  preset: minimal
  handlers:
    - all
  per_handler_limit: 48
  mode: input_profile
  changed_only: false
  unchanged_only: false
  invalid_only: false
  keep_existing: false

coverage:
  ontology: tests/generators/compliance_runners/state_transition/test_ontology.yaml
  html: true
  annotate: true
  json: true
