name: electra_validator_lifecycle_guided
description: Guided Electra validator lifecycle stage vectors backed by the state-transition test ontology.

generation:
  fork: electra
  preset: minimal
  stages:
    - validator_lifecycle
  per_handler_limit: 40
  guided: true
  changed_only: false
  unchanged_only: false
  invalid_only: false
  keep_existing: false

coverage:
  ontology: tests/generators/compliance_runners/state_transition/test_ontology.yaml
  html: true
  annotate: true
  json: true
