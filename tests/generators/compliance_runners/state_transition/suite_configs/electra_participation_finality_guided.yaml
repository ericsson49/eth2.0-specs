name: electra_participation_finality_guided
description: Guided Electra participation and finality stage vectors backed by the state-transition test ontology.

generation:
  output: state_transition_tests_participation_finality
  fork: electra
  preset: minimal
  stages:
    - participation_finality
  per_handler_limit: 40
  guided: true
  changed_only: false
  unchanged_only: false
  invalid_only: false
  keep_existing: false

coverage:
  output: state_transition_coverage_participation_finality
  ontology: tests/generators/compliance_runners/state_transition/test_ontology.yaml
  html: true
  annotate: true
  json: true
